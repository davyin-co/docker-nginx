name: Docker Image CI

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      name:
        description: 'Reason'
        required: true
        default: 'blabla...'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        provenance: false
        sbom: false
        push: true
        context: .
        platforms: linux/amd64,linux/arm64
        file: Dockerfile
        # subpath 已合并进主镜像（SUBDIR 环境变量控制），同一镜像多 tag
        tags: |
          davyinsa/nginx:latest
          davyinsa/nginx:subpath
    - name: Login to ALIYUN CR
      uses: docker/login-action@v3
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: ${{ secrets.ALIYUNCR_USERNAME }}
        password: ${{ secrets.ALIYUNCR_PASSWORD }}
    - name: Build and push to aliyun
      id: docker_build_aliyun
      uses: docker/build-push-action@v6
      with:
        provenance: false
        sbom: false
        push: true
        context: .
        platforms: linux/amd64,linux/arm64
        file: Dockerfile
        tags: |
          registry.cn-hangzhou.aliyuncs.com/davyin/nginx:latest
          registry.cn-hangzhou.aliyuncs.com/davyin/nginx:subpath