user  nginx;
worker_processes  auto;
# worker_connections 10240 需要足够的 fd 上限，否则 nginx 启动告警
# "worker_connections exceed open file resource limit" 并按 1024 生效
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections  10240;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;

    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    ## 注意：sites.enabled 必须在 conf.d 之前——无 server_name 的站点
    ## （如生产 proxy-to-dsf）依赖"首个 server 即默认 server"的规则生效
    include /etc/nginx/sites.enabled/*.conf;
    include /etc/nginx/conf.d/*.conf;

    ## vhost 中 proxy_set_header 较多时避免 proxy_headers_hash 告警
    proxy_headers_hash_max_size 1024;
}